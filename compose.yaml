# Prod stack. No build: keys, the VPS only pulls. Every tag comes from IMAGE_TAG in .env.
x-db-url: &db-url postgresql://penish:${POSTGRES_PASSWORD:?}@db:5432/penish?sslmode=disable

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: penish
      POSTGRES_DB: penish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Default 64mb /dev/shm is too small for parallel queries and index builds.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penish -d penish"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/tfpickard/penish-migrate:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: *db-url
    command: ["--wait", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/tfpickard/penish-api:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: *db-url
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # The worker's internal embed server, over the compose network only.
      EMBED_SERVER_URL: http://worker:8001
      # Unset keeps the defaults: the 60 most used tags, each on at least 2 pictures.
      TAG_CLOUD_LIMIT: ${TAG_CLOUD_LIMIT:-}
      TAG_CLOUD_MIN: ${TAG_CLOUD_MIN:-}
    ports:
      # Loopback only: Docker's published ports bypass ufw, so anything wider would be public.
      # The host cloudflared reaches it at http://localhost:8000.
      - "127.0.0.1:8000:8000"
    volumes:
      # rw for admin delete, which removes the files after the row. The admin crop UI also
      # streams originals from here. Bind mounts stay writable under read_only.
      - ./data/media/pub:/data/media/pub
      - ./data/media/orig:/data/media/orig
      # Admin uploads land here for the worker. Bind mounts stay writable under read_only.
      - ./data/inbox:/data/inbox
      # Read-only: the admin status call quotes the .err file of a failed group.
      - ./data/failed:/data/failed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      # Multipart bodies spool here; the upload cap is 50 MB.
      - /tmp:size=128m
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    image: ghcr.io/tfpickard/penish-worker:${IMAGE_TAG:?}
    environment:
      DATABASE_URL: *db-url
      DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      # Leaves a core free for the db and api on the 4-core box.
      EMBED_THREADS: "3"
    volumes:
      - ./data:/data
      - models:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No ports: the embed server on :8001 has no auth and must stay on the compose network.
    mem_limit: 6g
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  pgdata:
  models:
